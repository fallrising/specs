behavior:
  decision_order: 每日按職業清單順序，再按角色編號；基準策略不含隨機抽樣，seed作情境識別，評測以實際輸入變更覆蓋不同情境，不宣稱僅改seed會改變結果。
  phase_order: [expiry, job_completion, quest_reward, relist, purchase_and_start_work, consumption, report]
  daily_schedule:
    phase_hour: 每個遊戲日的第0小時（第d日為小時(d-1)*24）依phase_order執行一次；同一階段內依decision_order。
    job_settlement: 採集與製造都是工作。產出入庫與修理費在工作的完成小時結算，不等到下一日；下一日的job_completion階段只確認沒有逾期未結算的工作。當日完成的產出最早在下一日的relist與purchase_and_start_work階段使用。
    gathering_start: 採集者在purchase_and_start_work階段開始當日採集，受max_jobs_per_day限制。
    scheduled_mode_hours: 排定決策模式的動作可指定任意整數小時；同一小時先結算到期與已完成的工作，再依actions列出的順序執行。
  gathering: {hours: 6, output_qty: 8, max_jobs_per_day: 1}
  manufacturing:
    max_jobs_per_day: 1
    batch_size: 1
    decision: 以目前最低可購報價計算每個配方單批投入價；自有原料也用該價格估機會成本，無報價時用自身當日報價。費後收益為自身產出報價減預估成交費、投入價與本批修理費。只考慮正收益、可負擔且原料可取得的候選，選最高費後收益，同分按配方編號。
    missing_supply: 等待下一日，不根據未來商品啟動；當日購買與開工時重新檢查條件。
  adventurer:
    quest_reward_per_day: 5000
    demand_priority: [potion, sword, bow]
    potion_units_per_day: 1
    equipment_consumption_interval_days: 10
    equipment_units_each: 1
    unfilled_demand: 記錄未滿足，不借款、不累積補購；裝備只在第10日及其倍數提出當日需求。
  repair: {fee_per_completed_job: 10, applies_to: [gathering, manufacturing], insufficient_cash: 可支付多少就銷毀多少，餘額最低零，不形成債務}
  listing: 冒險者不出售；製造者對鏈內每種可作投入的商品保留一個配方批次，餘量掛單；採集者全部可用產出掛單。到期未售的非腐敗商品退回，下一日重新定價。保留投入不足時才依決策購買缺額。
  consumption: 當日買到的需求商品於該日消耗階段消耗，不足不補造。
market:
  trade_kind: buyout
  fee_basis_points: 200
  fee_rounding: floor
  fee_destination: destroyed
  min_price: 1
  max_price: 1000000
  max_buy_price_multiplier_of_initial: 4
  match_order: [ask_ascending, listed_time_ascending, order_id_ascending]
  self_trade: forbidden
  atomic_trade: 商品轉移、買方扣款、賣方收入與費用同時完成；任一不成立則全部不變。
  daily_ask_rule:
    sold_fraction_threshold: 0.5
    increase_basis_points: 500
    no_sales_decrease_basis_points: 500
    rounding: floor_then_clamp
    rule: 前日有掛單且售出比例達門檻則漲價；前日有掛單且完全沒賣出則降價；其他維持。首日使用initial_ask。比例以賣方該商品前日上架總量為分母。
