power:
  source_module: m03
  source_control_location: dock-always-accessible
  reachability: undirected-intact-closed-path-to-active-source
  switch_access: existing paths may be isolated from the dock panel without moving a module
  live_joint_rule: a joint bound to a path is live when either end module is powered by any route; opening only the joint's own path does not make it cuttable while an end stays powered
  cut_path_rule: a successful cut removes the bound path for the rest of the mission; its switch is disabled and cannot re-close it
  recovered_module_rule: a recovered module no longer exists for power; paths ending on it are removed, and recovering the source module leaves every module unpowered
  power_scope: power state gates cutting only; it never blocks tether, intake acceptance or exit
