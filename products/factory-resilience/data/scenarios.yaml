invalid_scenarios:
- base: bounded_demo
  change: append a new unique order O21
  expected: orders_max exceeded
- base: mini
  change: replace A cut input raw_plate with unknown_material
  expected: unknown material
before_start_fault:
  base: mini
  fault:
    resource: assembler1
    interval:
    - 3
    - 5
    reported_at: 3
  replanned_witness:
  - order: A
    operation: cut
    start: 0
    end: 2
  - order: B
    operation: cut
    start: 2
    end: 4
  - order: A
    operation: move
    start: 2
    end: 3
  - order: B
    operation: move
    start: 4
    end: 5
  - order: A
    operation: assemble
    start: 5
    end: 7
  - order: B
    operation: assemble
    start: 7
    end: 9
  - order: A
    operation: deliver
    start: 7
    end: 8
  - order: B
    operation: deliver
    start: 9
    end: 10
  expected:
    completion:
      A: 8
      B: 10
    makespan: 10
    total_tardiness: 5
    wip_integral: 16
    average_wip: 1.6
    window:
    - 0
    - 10
  lower_bound: 6
  classification: feasible; optimality not established
  generated_plan_acceptance:
    must_preserve: all completed and running operations at fault time; no start on unavailable resource
    all_orders_delivered: true
    makespan_max: 10
    total_tardiness_max: 5
    classification: feasible; optimality not established; order-specific completion times may differ from witness
interruption_policy:
  scope: M3 mini assembly only; other processing and carrier failure not introduced
  assembly_recovery:
    cut_plate: 1
    shell: 0
    fastener: 1
  assembly_waste:
    shell: 1
  output_on_interruption: {}
  fault_retry: Restart from beginning after repair and new valid input allocation; progress is not retained.
  cancel_before_start: release plan allocation; stock unchanged
  cancel_during_transport: finish current transport, leave cargo at destination, then cancel remaining operations
  cancel_delivered: reject; delivered inventory unchanged
  duplicate_identity: same report ID and same content applies once; same ID with different content is rejected
  unsupported: a fault that starts while its resource is running an operation other than mini assembly (a carrier in transport included), and a cancellation requested while the order is in a cut operation, are rejected as unsupported-interruption; no state changes and the reporter may retry later. Before M3 a fault that starts during assembly is rejected the same way. A fault that starts while its resource is idle is an ordinary before-start fault on any resource.
unsupported_interruptions:
- id: cutter_fault_during_cut
  base: mini
  report: {kind: fault, resource: cutter1, interval: [1, 3]}
  expected: {rejected: true, reason: unsupported-interruption, state_changed: false}
- id: cancel_during_cut
  base: mini
  report: {kind: cancellation, order: A, cancel_time: 1}
  expected: {rejected: true, reason: unsupported-interruption, order_state: in_progress, state_changed: false}
during_processing_fault:
  base: mini
  initial_stock_override:
  - location: cutting
    material: raw_plate
    quantity: 2
  - location: assembly
    material: shell
    quantity: 3
  - location: assembly
    material: fastener
    quantity: 2
  initial_mass: 16
  fault:
    report_id: fault-A-4
    resource: assembler1
    interval:
    - 4
    - 6
    reported_at: 4
    interrupted_order: A
  expected_after_fault:
    time: 4
    phase: after new starts
    available:
      cut_plate: 1
      shell: 2
      fastener: 2
    in_transit:
      cut_plate: 1
    processing_inputs: {}
    waste:
      shell: 1
    delivered: {}
    mass_total: 16
  replanned_witness:
  - order: A
    operation: cut
    start: 0
    end: 2
  - order: B
    operation: cut
    start: 2
    end: 4
  - order: A
    operation: move
    start: 2
    end: 3
  - order: B
    operation: move
    start: 4
    end: 5
  - order: A
    operation: assemble_interrupted
    start: 3
    end: 4
  - order: A
    operation: assemble_retry
    start: 6
    end: 8
  - order: B
    operation: assemble
    start: 8
    end: 10
  - order: A
    operation: deliver
    start: 8
    end: 9
  - order: B
    operation: deliver
    start: 10
    end: 11
  operation_aliases:
    assemble_interrupted: assemble; interrupted before output
    assemble_retry: assemble; new attempt after full recovery
  expected_final:
    completion:
      A: 9
      B: 11
    makespan: 11
    total_tardiness: 7
    delivered:
      assembled_unit: 2
    available: {}
    waste:
      shell: 1
    mass_total: 16
  generated_plan_acceptance:
    all_orders_delivered: true
    makespan_max: 11
    total_tardiness_max: 7
    mass_total: 16
    waste:
      shell: 1
    classification: feasible; optimality not established; generated schedule need not equal witness
cancellation_cases:
- id: before_start
  base: mini
  orders_only:
  - A
  initial_stock:
    raw_plate: 1
    shell: 1
    fastener: 1
  cancel_time: 0
  phase: before starts
  expected:
    order_state: cancelled
    available:
      raw_plate: 1
      shell: 1
      fastener: 1
    waste: {}
    output: {}
- id: during_assembly
  base: mini
  orders_only:
  - A
  initial_stock:
    raw_plate: 1
    shell: 1
    fastener: 1
  cancel_time: 4
  expected:
    order_state: cancelled
    available:
      cut_plate: 1
      fastener: 1
    waste:
      shell: 1
    output: {}
- id: during_transport
  base: mini
  orders_only:
  - A
  initial_stock:
    raw_plate: 1
    shell: 1
    fastener: 1
  cancel_time: 2.5
  expected:
    order_state_at_request: cancellation_pending
    order_state_at:
      time: 3
      state: cancelled
    available:
      cut_plate: 1
      shell: 1
      fastener: 1
    cut_plate_location: assembly
    waste: {}
    output: {}
- id: after_delivery
  base: mini
  orders_only:
  - A
  initial_stock:
    raw_plate: 1
    shell: 1
    fastener: 1
  cancel_time: 6
  phase: after completion
  expected:
    rejected: true
    order_state: delivered
    delivered:
      assembled_unit: 1
duplicate_reports:
- id: start-A-3
  kind: assembly_start
  repetitions: 2
  expected_effect_count: 1
- id: fault-A-4
  kind: fault_and_recovery
  repetitions: 2
  expected_effect_count: 1
- id: finish-A-8
  kind: retry_completion
  repetitions: 2
  expected_effect_count: 1
- id: deliver-A-9
  kind: delivery
  repetitions: 2
  expected_effect_count: 1
- id: fault-A-4
  kind: same identity with altered repair end
  altered_repair_end: 7
  expected: reject conflicting content; retain original recovery and repair end
metric_edge_cases:
- case: incomplete
  base: mini
  stop_at: 5
  expected_pending_orders: 2
  expected_makespan_status: incomplete
- case: no_available_time
  window:
  - 0
  - 8
  resource: assembler1
  unavailable:
  - 0
  - 8
  expected_idle_ratio: null
interaction_walkthrough:
- load mini
- inspect A and stock
- introduce overlap from invalid_plans
- read conflict and restore witness
- run
- pause and inspect material
- advance one event
- finish deliveries
- read metrics
- reset
replay_cases:
  bases:
  - mini
  - before_start_fault
  - during_processing_fault
  save_times:
  - 3
  - 4
  - 5
  playback_rates:
  - 1
  - 4
  - 16
  comparison: business state equality; interrupted fixture applies only after M3
invalid_saved_states:
- change: set raw_plate quantity to -1
  expected: negative inventory
- change: set fixture version to unknown-version
  expected: unsupported fixture version
presentation_review:
  viewport:
  - 1280
  - 720
  required_fields:
  - order ID
  - operation
  - resource
  - start/end
  - material location
  - due/completion
  - fault reason
  - metrics observation window
cancellation_case_note: Each case is independent, inherits mini station locations and only the listed A order. Flat
  initial_stock counts replace mini counts at the same locations; unlisted materials start at zero.
