schema: factory-resilience-scenarios/v1
status: draft
fixture_version: 2026-11-16-draft1
purpose: 業務 fixture 與可行 witness；待參考實作確認，不代表產品驗收。
units:
  time: tick; planned operation starts/ends are integer ticks; external cancellation requests may use half ticks;
    all fault endpoints in these fixtures are integers
  quantity: whole items
  mass: abstract mass unit; no claim of real process accuracy
limits:
  machine_kinds: 6
  material_kinds: 8
  orders_max: 20
  resource_instances_max: 6
  scenario_horizon_max: 480
  finite_orders_only: true
  order_quantity_max: 1
  order_quantity_note: every fixture order is one unit through the route once; a scenario with another quantity is rejected at load until batching rules are specified
  external_event_time_quantum: 0.5
fault_semantics:
  interval: half-open [start, end); the resource may start work again at end
  reported_at: the fault and its repair end become known at the fault start tick; a plan made earlier may not anticipate it
  facts_kept_on_replan: operations finished or already running at reported_at, and transports already started
event_order:
- finish_due_operations
- apply_faults_and_cancellations
- start_new_operations
machine_kinds:
- cutter
- press
- heater
- assembler
- inspector
- carrier
materials:
  raw_plate:
    label: 原板
    unit_mass: 4
  cut_plate:
    label: 裁切板
    unit_mass: 4
  formed_plate:
    label: 成形板
    unit_mass: 4
  treated_plate:
    label: 熱處理板
    unit_mass: 4
  raw_resin:
    label: 樹脂料
    unit_mass: 2
  shell:
    label: 外殼
    unit_mass: 2
  fastener:
    label: 緊固件
    unit_mass: 1
  assembled_unit:
    label: 組裝成品
    unit_mass: 7
location_rule: Fixture initial stock is explicitly at cutting or assembly. No additional transport to first station
  is required. Full-route shells and fasteners are already at assembly. No unlisted replenishment.
metric_definitions:
  completion: end of delivery; pending is null
  tardiness: max(0, completion - due); incomplete order remains pending
  total_tardiness: sum completed order tardiness; only comparable as final when all orders terminal
  makespan: latest delivery end minus earliest release; incomplete plan is labelled incomplete
  wip: orders from first processing start inclusive to delivery or cancellation completion exclusive
  average_wip: integral of wip over [earliest release, final terminal event) divided by window length
  idle_ratio: (window length - busy time - unavailable time)/(window length - unavailable time); null when denominator
    is zero
  mass_balance: available + processing input mass + in-transit mass + waste + delivered = initial mass + explicit
    replenishment
mini:
  resources:
  - &id001
    id: cutter1
    kind: cutter
    capacity: 1
  - &id002
    id: assembler1
    kind: assembler
    capacity: 1
  - &id003
    id: carrier1
    kind: carrier
    capacity: 1
  route:
  - id: cut
    resource: cutter1
    duration: 2
    inputs:
      raw_plate: 1
    outputs:
      cut_plate: 1
    location: cutting
  - id: move
    resource: carrier1
    duration: 1
    material: cut_plate
    quantity: 1
    from: cutting
    to: assembly
  - id: assemble
    resource: assembler1
    duration: 2
    inputs:
      cut_plate: 1
      shell: 1
      fastener: 1
    outputs:
      assembled_unit: 1
    location: assembly
  - id: deliver
    resource: carrier1
    duration: 1
    material: assembled_unit
    quantity: 1
    from: assembly
    to: delivered
  orders:
  - id: A
    release: 0
    due: 6
    quantity: 1
  - id: B
    release: 0
    due: 7
    quantity: 1
  initial_stock:
  - location: cutting
    material: raw_plate
    quantity: 2
  - location: assembly
    material: shell
    quantity: 2
  - location: assembly
    material: fastener
    quantity: 2
  initial_mass: 14
  feasible_witness:
  - order: A
    operation: cut
    start: 0
    end: 2
  - order: B
    operation: cut
    start: 2
    end: 4
  - order: A
    operation: move
    start: 2
    end: 3
  - order: B
    operation: move
    start: 4
    end: 5
  - order: A
    operation: assemble
    start: 3
    end: 5
  - order: B
    operation: assemble
    start: 5
    end: 7
  - order: A
    operation: deliver
    start: 5
    end: 6
  - order: B
    operation: deliver
    start: 7
    end: 8
  witness_classification: feasible; optimality not established
  makespan_lower_bound:
    value: 6
    reason: one order critical path; valid lower bound only
  expected:
    delivered:
      assembled_unit: 2
    remaining_stock: {}
    waste_mass: 0
    completion:
      A: 6
      B: 8
    metrics:
      window:
      - 0
      - 8
      makespan: 8
      tardiness:
        A: 0
        B: 1
      total_tardiness: 1
      wip_integral: 12
      average_wip: 1.5
      busy_time:
        cutter1: 4
        assembler1: 4
        carrier1: 4
      idle_ratio:
        cutter1: 0.5
        assembler1: 0.5
        carrier1: 0.5
  ledger_checkpoints:
  - time: 0
    phase: after starts
    available:
      raw_plate: 1
      shell: 2
      fastener: 2
    processing_inputs:
      raw_plate: 1
    in_transit: {}
    delivered: {}
    mass_total: 14
  - time: 3
    phase: after starts
    available:
      shell: 1
      fastener: 1
    processing_inputs:
      raw_plate: 1
      cut_plate: 1
      shell: 1
      fastener: 1
    in_transit: {}
    delivered: {}
    mass_total: 14
  - time: 5
    phase: after starts
    available: {}
    processing_inputs:
      cut_plate: 1
      shell: 1
      fastener: 1
    in_transit:
      assembled_unit: 1
    delivered: {}
    mass_total: 14
  - time: 8
    phase: after completions
    available: {}
    processing_inputs: {}
    in_transit: {}
    delivered:
      assembled_unit: 2
    mass_total: 14
  invalid_plans:
  - case: overlap
    change:
      order: B
      operation: cut
      start: 1
      end: 3
    expected_conflict:
      resource: cutter1
      orders:
      - A
      - B
      interval:
      - 1
      - 2
  - case: assembly_before_arrival
    change:
      order: A
      operation: assemble
      start: 2
      end: 4
    expected_conflict:
      order: A
      required_predecessor: move
      arrival: 3
