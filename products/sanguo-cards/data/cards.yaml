# 卡池與預組牌組。業務內容的唯一來源；項目以固定 specs commit SHA 取用。
# 數值為初版設計，未經模擬驗證；平衡目標見 REQ-CRD-06，調整走 SDD PR。
schema: card-pool/v1
version: 1

deck_rules:
  size: 30
  max_copies: 2          # 同名卡上限
  max_copies_general: 1  # 武將同名上限

factions:
  - {id: shu, name: 蜀, lord: L-SHU, milestone: M1}
  - {id: wei, name: 魏, lord: L-WEI, milestone: M1}
  - {id: wu, name: 吳, lord: null, milestone: M2}    # 主公與卡池在 M2 前補
  - {id: qun, name: 群雄, lord: null, milestone: M2}
  - {id: neutral, name: 中立, lord: null, milestone: M1}

lords:
  - id: L-SHU
    name: 劉備
    faction: shu
    hp: 30
    skill: {name: 仁德, cost: 2, text: 回復一個友方部隊或你的主公 2 點（不超過上限）。}
  - id: L-WEI
    name: 曹操
    faction: wei
    hp: 30
    skill: {name: 奸雄, cost: 2, text: 對一個敵方部隊造成 1 點傷害。}

