    - -0.5181682791355
    - 0.24433633196521
    velocity:
    - 0.94158977980184
    - -0.02550535666037
  - time: 1.0
    position:
    - -0.03634903077279
    - 0.20505488556328
    velocity:
    - 1.00981237787248
    - -0.21073399158417
  - time: 1.5
    position:
    - 0.39534063067828
    - -0.01115633400575
    velocity:
    - 0.70137625389829
    - -0.51055296957293
  - time: 2.0
    position:
    - 0.71090075965566
    - -0.26245609660023
    velocity:
    - 0.58039438166996
    - -0.49337683502074
  specific_energy: -0.044646063364100486
  closest_approach:
    source: secondary
    time: 1.0966644084695563
    distance: 0.18881818832268873
  reference_classification: cross-checked numerical estimate; not an analytic proof or real mission model
  reference_provenance:
    checked_on: '2026-11-16'
    procedure: two independent high-accuracy numerical estimates of the declared equations; temporary verification
      only, no implementation choice imposed
    sample_agreement_max: 1.0e-10
    note: printed samples agree to the displayed precision; closest approach was separately minimized over the local
      flyby interval
tolerances:
  norm: Euclidean for vector differences; maxima over stated sample set; separate position and velocity checks
  circular:
    position_absolute: 0.0005
    velocity_absolute: 0.0005
    initial_invariants_absolute: 1.0e-12
  impulse:
    instantaneous_position_absolute: 1.0e-12
    instantaneous_velocity_absolute: 1.0e-10
    fuel_absolute: 1.0e-10
    energy_absolute: 1.0e-10
    apoapsis_position_absolute: 0.0005
    apoapsis_velocity_absolute: 0.0005
  mission:
    event_time_absolute: 0.002
    event_position_absolute: 0.001
  flyby:
    position_absolute: 0.0001
    velocity_absolute: 0.0001
    closest_distance_absolute: 0.0001
    closest_time_absolute: 0.0002
  prediction:
    position_absolute: 0.0001
    velocity_absolute: 0.0001
    fuel_absolute: 1.0e-10
    event_time_absolute: 0.002
  replay:
    position_absolute: 1.0e-08
    velocity_absolute: 1.0e-08
    fuel_absolute: 1.0e-12
    event_time_absolute: 1.0e-08
  high_speed_event:
    time_absolute: 1.0e-06
    position_absolute: 1.0e-05
    simultaneous_time_window: 1.0e-06
  energy_relative: 0.0001
  angular_momentum_relative: 0.0001
  relative_error_denominator_floor: 1.0e-10
convergence_audit:
  scenarios:
  - circular_baseline
  - restricted_flyby
  allowed_time_resolutions:
  - 0.02
  - 0.01
  - 0.005
  meaning: maximum time advance permitted during the numerical quality audit; finer internal evaluation allowed;
    no integration method is specified
  samples: scenario reference_samples
  criterion: fine-to-finest error <= max(coarse-to-fine error, roundoff_floor), separately for position and velocity;
    finest meets scenario oracle
  fine_to_finest_max: 0.0001
  roundoff_floor: 1.0e-10
conservation_audit:
  cases:
  - base: circular_baseline
    end_time: 62.83185307179586
    sample_interval: 0.7853981633974483
    also_include_endpoint: true
    energy_reference: -0.5
    angular_momentum_reference: 1
  - base: restricted_flyby
    end_time: 2
    sample_interval: 0.05
    also_include_endpoint: true
    energy_reference: -0.044646063364100486
    angular_momentum_check: false
  relative_error: abs(value-reference)/max(abs(reference), denominator_floor)
  required: maximum over every requested sample, not only final sample
prediction_cases:
- base: circular_baseline
  samples: reference_samples
- base: single_impulse_calibration
  samples:
  - 0
  - 1
  - 2
  - 4
  - 7.496660305190688
- base: single_impulse_mission
  samples: until terminal event
  compare_terminal: true
- base: restricted_flyby
  samples: reference_samples
replay_cases:
  cases:
  - base: single_impulse_mission
    save_times:
    - 0
    - 1
    - 7.432375474423298
    burn_at_zero_must_be_retained: true
  - base: restricted_flyby
    save_times:
    - 0.5
    - 1
  playback_rates:
  - 1
  - 10
  - 100
  comparison: same simulated time; compare states, fuel, applied impulse count and terminal event
  m3_extension: repeat all high_speed_events after M3, including saving and reloading terminal states
invalid_saved_states:
- change: fuel = -0.1
  expected: negative fuel
- change: position x = NaN
  expected: non-finite position
- change: fixture_version = unknown-version
