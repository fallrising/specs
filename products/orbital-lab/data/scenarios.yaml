schema: orbital-lab-scenarios/v1
status: draft
fixture_version: 2026-11-16-draft1
purpose: 解析與交叉計算之業務參考；待參考實作確認，不代表產品已驗收。
units:
  distance: L0
  time: T0
  velocity: L0/T0
  gravity_parameter: L0^3/T0^2
  gravity_mass: Mg
  probe_and_fuel_mass: Mp
  Mp_over_Mg: 1.0e-12
  normalized_gravitational_constant: 1
  specific_energy: L0^2/T0^2
  specific_angular_momentum: L0^2/T0
  angle: radian
  display: dimensionless reference units; no SI labels or real-world scale implied
model:
  plane: xy; z and vz identically zero
  sources: fixed point gravity sources; no mutual motion
  probe: test particle; no gravitational reaction on sources
  acceleration: sum(-mu_i*(r-c_i)/norm(r-c_i)^3)
  energy: 0.5*norm(v)^2 - sum(mu_i/norm(r-c_i))
  collision: stop at inclusive effective radius, before gravity singularity
  propulsion: single instantaneous velocity change; no burn duration, attitude or thrust arc
  fuel_used: (dry_mass + fuel_before)*(1-exp(-norm(delta_v)/exhaust_velocity))
  remaining_delta_v: exhaust_velocity * ln((dry_mass + fuel)/dry_mass)
limits:
  gravity_sources_max: 2
  probes: 1
  successful_impulses_max: 1
  simulation_time_max: 80
  coordinate_abs_max: 20
  initial_speed_max: 20
  initial_fuel_max: 0.5
probe:
  dry_mass: 1
  initial_fuel: 0.5
  exhaust_velocity: 2
  maximum_initial_delta_v: 0.8109302162163288
event_policy:
  regions: closed disks; tangent contact counts; speed limit inclusive
  first_event: earliest eligible terminal event
  simultaneous_priority:
  - collision
  - out_of_bounds
  - success
  - timeout
  initial_inside: evaluate at t=0
  finished_state: freeze physical state at terminal event; retain one result
  duplicate: same command identity and same content applies once; conflicting content rejected
  domain_boundary: touching abs(x) or abs(y) equal to coordinate_abs_max is terminal; valid interior is strictly
    below that limit
  simultaneous_tolerance: tolerances.high_speed_event.simultaneous_time_window
circular_baseline:
  sources:
  - id: primary
    position:
    - 0
    - 0
    mu: 1
    collision_radius: 0.1
  initial:
    time: 0
    position:
    - 1
    - 0
    velocity:
    - 0
    - 1
  goal: null
  period: 6.283185307179586
  specific_energy: -0.5
  specific_angular_momentum: 1
  analytic_solution: r(t)=(cos(t),sin(t)); v(t)=(-sin(t),cos(t))
  reference_samples:
  - time: 0
    position:
    - 1
    - 0
    velocity:
    - 0
    - 1
  - time: 1.5707963267948966
    position:
    - 0
    - 1
    velocity:
    - -1
    - 0
  - time: 3.141592653589793
    position:
    - -1
    - 0
    velocity:
    - 0
    - -1
  - time: 4.71238898038469
    position:
    - 0
    - -1
    velocity:
    - 1
    - 0
  - time: 6.283185307179586
    position:
    - 1
    - 0
    velocity:
    - 0
    - 1
single_impulse_calibration:
  base: circular_baseline
  impulse:
    id: burn-1
    time: 0
    delta_v:
    - 0
    - 0.2
  post_impulse:
    time: 0
    position:
    - 1
    - 0
    velocity:
    - 0
    - 1.2
    fuel_used: 0.14274387294606072
    fuel_remaining: 0.3572561270539393
    specific_energy: -0.28
    specific_angular_momentum: 1.2
  ellipse:
    semimajor_axis: 1.7857142857142858
    eccentricity: 0.44
    apoapsis_radius: 2.5714285714285716
    apoapsis_time: 7.496660305190688
    apoapsis_position:
    - -2.5714285714285716
    - 0
    apoapsis_velocity:
    - 0
    - -0.4666666666666667
    reference_classification: analytic under declared two-body impulse model
  goal: null
  duplicate_test:
    repeat_command_id: burn-1
    expected_effect_count: 1
single_impulse_mission:
  base: single_impulse_calibration
  goal:
    center:
    - -2.5714285714285716
    - 0
    radius: 0.03
    speed_max: 0.6
    requires_successful_impulse: true
  deadline: 8
  expected_success:
    time: 7.432375474423298
    position:
    - -2.5711160779929663
    - 0.029998372420061765
    status: success
    fuel_remaining: 0.3572561270539393
    reference_method: 'analytic ellipse: x=a(cos(E)-e), y=a*sqrt(1-e^2)*sin(E), t=(E-e*sin(E))*a^(3/2); earliest
      root at target boundary'
invalid_impulses:
- case: fuel_insufficient
  delta_v:
  - 0
  - 1
  expected: reject; exceeds available delta-v
- case: zero_direction
  direction:
  - 0
  - 0
  magnitude: 0.2
  expected: reject invalid direction
- case: not_finite
  delta_v:
  - NaN
  - 0.2
  expected: reject non-finite input
- case: second_distinct_impulse
  after: burn-1
  id: burn-2
  delta_v:
  - 0.1
  - 0
  expected: reject second impulse
- case: changed_same_identity
  after: burn-1
  id: burn-1
  delta_v:
  - 0
  - 0.3
  expected: reject conflicting command content
terminal_baselines:
- id: no_burn_timeout
  base: single_impulse_mission
  impulse: null
  expected:
    status: timeout
    time: 8
- id: initial_collision
  sources:
  - id: primary
    position:
    - 0
    - 0
    mu: 1
    collision_radius: 0.1
  initial:
    time: 0
    position:
    - 0.05
    - 0
    velocity:
    - 0
    - 0
  expected:
    status: collision
    time: 0
- id: out_of_bounds
  sources: []
  initial:
    time: 0
    position:
    - 19
    - 0
    velocity:
    - 1
    - 0
  expected:
    status: out_of_bounds
    time: 1
    position:
    - 20
    - 0
