interaction_walkthrough:
- load mission
- inspect units and circular baseline
- set candidate impulse
- preview and inspect required fuel
- cancel preview and verify unchanged state
- set approved fixture impulse
- preview
- confirm once
- pause and resume
- read terminal result
- reset
presentation_review:
  viewport:
  - 1280
  - 720
  required_fields:
  - simulation time and unit
  - position and velocity units
  - fuel and mass unit
  - predicted/actual labels
  - physical plane and axis directions
  - effective collision and goal radii
  - fixed-source assumption
  - terminal cause and time
  keyboard_actions:
  - select scenario
  - edit impulse
  - preview
  - cancel preview
  - confirm
  - pause/resume
  - change playback rate
  - inspect result
  - reset
