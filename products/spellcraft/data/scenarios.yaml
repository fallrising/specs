content: spellcraft-business-scenarios
status: draft
expected_results: proposed-not-reference-validated
units:
  time: seconds
  distance: metres
  damage: health-points
  mana: mana-points
catalog:
  base_element_count: 4
  base_node_type_count: 9
  base:
  - id: projectile
    name: 投射物
    cost: 4
  - id: fire
    name: 火
    cost: 6
  - id: water
    name: 水
    cost: 5
  - id: ice
    name: 冰
    cost: 6
  - id: lightning
    name: 電
    cost: 8
  - id: split
    name: 分裂
    cost: 4
  - id: homing
    name: 追蹤
    cost: 3
  - id: delay
    name: 延遲
    cost: 2
  - id: on_hit
    name: 命中觸發
    cost: 6
  extension:
  - id: oil
    name: 油
    cost: 5
    milestone: M3
composition:
  max_nodes: 12
  max_stages: 3
  max_cost: 100
  root_trigger_count: 1
  split_multiplier: 3
  allowed_modifiers:
  - split
  - homing
  - delay
  max_each_modifier_per_stage: 1
  allowed_delay_seconds:
  - 0
  - 0.25
  - 0.5
  - 1
  default_delay_seconds: 0.5
  stage_shape:
  - projectile
  - exactly-one-element
  - optional-unique-modifiers
  - optional-terminal-on_hit-with-child-stage
  cost_rule: sum over stages of node-price-sum times worst emissions; worst emissions equals parent worst emissions
    times local split multiplier
  error_priority:
  - unknown-node
  - cycle-or-merge
  - missing-or-multiple-element
  - invalid-stage-order
  - missing-child-stage
  - node-limit
  - stage-limit
  - repeated-modifier
  - cost-limit
  - cooldown
  - insufficient-mana
arena:
  cast_origin_m:
  - 0
  - -10
  target_radius_m: 0.4
  seed: 1729
  business_randomness: none
  cast_cooldown_seconds: 0.25
  initial_state:
    mana: 100
    targets:
    - id: T01
      position_m:
      - 0
      - 0
      health: 150
    - id: T02
      position_m:
      - 3
      - 0
      health: 100
    - id: T03
      position_m:
      - 0
      - 4
      health: 100
    - id: T04
      position_m:
      - 0
      - 8
      health: 100
    all_statuses: []
    projectiles: []
    pending_events: []
    oil_tiles: []
    elapsed_seconds: 0
  mana_regeneration_per_second: 0
  health_floor: 0
  death_rule: remove target from hit selection, clear statuses and cancel future periodic damage for that target
  reset_rule: restore initial state, cancel all active and pending effects, retain old log read-only
  initial_status_timing: case-provided initial statuses begin with full duration at case time zero unless specified
    otherwise
projectile:
  speed_m_per_second: 10
  max_lifetime_seconds: 3
  max_travel_distance_m: 30
  split_angles_degrees:
  - -15
  - 0
  - 15
  homing_radius_m: 12
  homing_selection: nearest alive target from emission origin, tie by target id
  homing_steering: during each event step, head directly toward the locked target current position without exceeding
    projectile speed
  on_target_death: continue current heading without reacquisition
  maximum_direct_hits: 1
  child_origin: fixed round cast origin
  child_aim: original hit target position captured at trigger time
  child_delay_origin: next event step after parent hit
  dead_child_target: suppress with target-dead reason
  miss: expire without child trigger
budgets:
  emissions_per_cast: 12
  secondary_propagations_per_cast: 4
  secondary_consumers:
  - each-conduction-recipient
  - each-oil-tile-ignition
  overflow: suppress new event, keep prior effects, log budget-exhausted, no refund
  indirect_hits_trigger_children: false
elements:
  fire:
    direct_damage: 20
    wet_damage: 10
    burn_damage_per_tick: 5
    burn_tick_interval_seconds: 1
    burn_duration_seconds: 3
    burn_tick_offsets_seconds:
    - 1
    - 2
    - 3
    wet_rule: consume wet, reduced damage, no burn and no oil ignition
    frozen_rule: remove frozen before checking wet
    chilled_rule: chilled persists unless naturally expired
    refresh_rule: replace remaining burn schedule with new tick offsets
  water:
    direct_damage: 0
    wet_duration_seconds: 4
    burning_rule: remove burning and cancel future target burn ticks
    frozen_rule: preserve frozen
    oil_rule: remove oil and oil fire only on hit tile
  ice:
    direct_damage: 10
    frozen_duration_seconds: 2
    chilled_duration_seconds: 2
    frozen_movement_multiplier: 0
    chilled_movement_multiplier: 0.5
    normal_movement_multiplier: 1
    burning_rule: extinguish before wet check
    wet_rule: consume wet, clear chilled and apply frozen
    dry_rule: refresh frozen if already frozen, otherwise apply chilled
  lightning:
    direct_damage: 15
    wet_direct_damage: 30
    conduction_damage: 30
    conduction_radius_m: 4
    max_secondary_targets_per_direct_hit: 2
    secondary_selection: still-wet alive targets, distance from struck target then target id, exclude struck target
    wet_rule: consume wet on direct and secondary victims
    secondary_recursion: false
    other_statuses: preserve burning, frozen and chilled
event_order:
  step_seconds: 0.05
  phases:
  - periodic-damage-due-including-final-tick
  - expire-statuses-at-this-time
  - ordered-direct-hits
  - for-each-hit-complete-status-transition
  - for-each-hit-complete-secondary-propagations
  - schedule-child-for-next-event-step-or-later
  direct_hit_ties:
  - accepted-cast-order
  - stage-order
  - projectile-order
  - target-id
  same_kind_status: refresh expiration; never stack intensity
  same_time_death: clear target statuses and cancel all its remaining periodic events before processing next event
  oil_periodic_order: target burning, then oil-cell damage; each with own cause
recipes:
  valid:
    water_bolt:
      stages:
      - nodes:
        - projectile
        - water
        worst_emissions: 1
        stage_cost: 9
      node_count: 2
      cost: 9
      remaining_mana: 91
    wet_then_spark:
      stages:
      - nodes:
        - projectile
        - water
        - on_hit
        worst_emissions: 1
        stage_cost: 15
      - nodes:
        - projectile
        - lightning
        worst_emissions: 1
        stage_cost: 12
      node_count: 5
      cost: 27
      remaining_mana: 73
    split_delayed_homing_fire:
      stages:
      - nodes:
        - projectile
        - fire
        - split
        - homing
        - delay
        delay_seconds: 0.5
        worst_emissions: 3
        stage_cost: 57
      node_count: 5
      cost: 57
      remaining_mana: 43
    split_lightning:
      stages:
      - nodes:
        - projectile
        - lightning
        - split
        worst_emissions: 3
        stage_cost: 48
      node_count: 3
      cost: 48
      remaining_mana: 52
  invalid:
  - id: unknown-node
    stages:
    - - projectile
      - teleport
    reason: unknown-node
  - id: cycle
    nodes:
    - a:projectile
    - b:water
    - c:on_hit
    connections:
    - a to b
    - b to c
    - c to a
    reason: cycle-or-merge
  - id: merge
    nodes:
    - a:projectile
    - b:water
    - c:ice
    - d:on_hit
    connections:
    - a to b
    - a to c
    - b to d
    - c to d
    reason: cycle-or-merge
  - id: missing-element
    stages:
    - - projectile
      - split
    reason: missing-or-multiple-element
  - id: multiple-element
    stages:
    - - projectile
      - water
      - fire
    reason: missing-or-multiple-element
  - id: modifier-before-element
    stages:
    - - projectile
      - split
      - water
    reason: invalid-stage-order
  - id: dangling-trigger
    stages:
    - - projectile
      - water
      - on_hit
    reason: missing-child-stage
  - id: too-many-nodes
    stages:
    - - projectile
      - water
      - split
      - homing
      - delay
      - on_hit
    - - projectile
      - water
      - split
      - homing
      - delay
      - on_hit
    - - projectile
      - water
    node_count: 14
    reason: node-limit
  - id: too-many-stages
    stages:
    - - projectile
      - water
      - on_hit
    - - projectile
      - water
      - on_hit
    - - projectile
      - water
      - on_hit
    - - projectile
      - water
    node_count: 11
    reason: stage-limit
  - id: duplicate-split
    stages:
    - - projectile
      - water
      - split
      - split
    reason: repeated-modifier
  - id: over-cost
    stages:
    - - projectile
      - fire
      - split
      - homing
      - delay
      - on_hit
    - - projectile
      - lightning
      - split
      - homing
      - delay
    node_count: 11
    calculated_cost: 264
    stage_costs:
    - 75
    - 189
    reason: cost-limit
  extension:
    oil_bolt:
      stages:
      - nodes:
        - projectile
        - oil
        worst_emissions: 1
        stage_cost: 9
      node_count: 2
      cost: 9
      remaining_mana: 91
